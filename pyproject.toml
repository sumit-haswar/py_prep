[tool.poetry]
name = "py-prep"
version = "0.1.0"
description = ""
authors = ["sumit-haswar"]
readme = "README.md"
packages = [{include = "_3"}]

[tool.poetry.dependencies]
python = "^3.9"
sortedcontainers = "^2.4.0"
pandas = "^2.2.1"
openpyxl = "^3.1.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
isort = "^5.13.2"
flake8 = "^7.0.0"
black = "^24.3.0"
pytest-cov = "^5.0.0"

[tool.black]
line-length = 120
target-version = ["py39"]
exclude = '''
(
  /(
    | \.git          # root of the project
    | \.pytest_cache
    | \.venv
    | dist
  )/
)
'''

[tool.isort]
line_length = 120
multi_line_output=3
force_sort_within_sections=true
case_sensitive=false
include_trailing_comma=true
order_by_type=false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
